>(e.condomStock??1)<=0,onApply:()=>({pregnant:!0})}],Kn={serve_oral:'大小姐为{n}人进行了口交侍奉',serve_vaginal:'大小姐供奉了{n}人',serve_anal:'大小姐被{n}人开发了后穴',serve_violent:'暴力供奉已完成',serve_violent_hang:'（已结算·吊颈轮奸）',serve_violent_horse:'（已结算·三角木马）',serve_violent_donkey:'（已结算·通电木驴）',serve_violent_water:'（已结算·水刑轮奸）',serve_violent_cane:'（已结算·杖笞调教）',serve_violent_latex:'（已结算·胶衣调教）',serve_violent_ginger:'（已结算·姜罚调教）',serve_violent_wax:'（已结算·温度调教）',serve_advance:'大小姐被{n}人极限轮奸',serve_pregnant:'大小姐挺着孕肚被{n}人使用',birth_rape:'（已结算·临盆轮奸）',rest:'凛回房歇下，养精蓄锐。',recruit:'招募事宜处理完毕。',scout:'刺探已完成。',buy_condoms:'采购了一批避孕套。',attack:'据点战事已了结。',harass:'骚扰行动已结束。',bribe:'贿赂之事已办妥。',reward_thugs:'犒赏了麾下打手，人心稍定。',protection:'保护费已收讫。',school:'大小姐处理了学校事务。',dine:'外出用餐完毕。',daily_toy:'大小姐的日常起居处理完毕。',garbage:'宅子打扫了一番。',garden_walk:'大小姐在庭院散步锻炼了一阵。',garden_orgy:'（庭院群交·避孕套被挥霍一空）',forced_leave:'（已结算白日供奉）',condom_zero_2:'大小姐在打手的指使下，循环利用了几个用过的避孕套。',condom_zero_3:'——避孕套用完了。打手们对视而笑。'},$n={presentCount:[0,2e3]};Object.values(Mn).filter(e=>e.isServe).map(e=>e.id);function Dn(){return{async expand(e){const{resolution:n,attitude:t,state:o}=e,a='ai_full'===n.renderMode?'【首次·重点扩写】':'ai_normal'===n.renderMode?'【NSFW常规】':'【略写】',r=n.paradigm.inlinePrompt?'定制范式':n.paradigm.worldbookKey;return{text:`${a}（mock 正文·态度:${t}）凛执行了「${n.option.label}」。在场约 ${o.presentCount} 人。这里将来是 AI1 按范式 ${r} 扩写的正文。`,continuity:n.option.needsContinuity?`（mock延续摘要）「${n.option.label}」发生了需后续回调的独特事实。`:void 0}},extract:async e=>({presentCount:e.state.presentCount||18})}}function In(e){return{secondaryKeys:[],comment:'',order:100,position:'before_char',selective:!1,selectiveLogic:'and_any',constant:!1,probability:100,addMemo:!0,...e}}const An={id:'jiutiao-wb',name:'九条会世界书 v1',entries:[In({id:'c_aesthetic',keys:['美学纲领'],constant:!0,order:10,content:'【体验内核】地位倒错下的极致淫乱、全天候性化与快感吞没。\n核心质地:神圣的极道千金,在肮脏底层巨汉胯下,被无尽性快感彻底碾碎意志,生活被全方位剥夺并性化。\n- A面(外界):她是发号施令的女王,男人是忠诚恶犬。但这"忠诚"本身是最恶毒的调教。\n- B面(大宅):私人空间被彻底剥夺,威严大宅变成满地精液避孕套垃圾的淫窟。生活全天候性化。堕落不是悲伤过程,是荒诞热烈汁液四溅的狂欢。\n终极高潮=凛的"意志被快感泡软":大脑还在抗拒,娇小身体已被彻底开发。绝对物理碾压下思考被剥夺,翻白眼流口水发出毫无尊严的淫叫,沦为只知渴求快感的肉体。\n【呈现】淫秽色情:极强端。极度强调体型差(娇小vs巨汉)与器官尺寸差。详写双插/三明治时肉壁摩擦、子宫撞击。拟声密集(咕啾/噗嗤/啪啪)。暴力:中端,服务性刺激,允许淤青/指痕/吻痕,禁永久损伤。血腥:极弱。焦点:生理感官六成,心理羞耻四成。氛围:荒诞、淫靡、热烈、充满雄性恶臭。没有绝望沉痛。'}),In({id:'c_narrative',keys:['叙事核心'],constant:!0,order:20,content:'【核心倾向·快感引擎(最高)】让凛堕落的不是打手的淫辱或暴力本身,而是"快感侵蚀身体,身体侵蚀意志"。任何外部刺激(淫辱/暴力/玩具/羞耻/痛)都要转化成凛身体的快感,再由快感泡软意志、带来堕落。笔墨永远落在"凛感受到的快感"上,而非施加于她的行为本身。露骨描写的目的=勾起对凛女体快感的想象,强调她不受控的身体反应(分泌/绞紧/痉挛/敏感飙升/翻白眼吐舌)。身体的背叛>意志的屈服。\n【多人常态·服从拓扑】本卡是多人色情,默认追求"两个接两个"(下身双穴同时被前后贯穿/多点同时),而非单纯一个接一个。但必须符合空间拓扑:只在姿势物理上真能容纳多人同时侵犯某些孔洞时才写双穴/多点同时;被姿势/受力占用而腾不出的孔洞,用玩具替代或就写该场景能成立的样子,绝不强行硬塞。\n【视角】紧贴凛的身体与感官(约80%)。摄像机死钉双穴/子宫/乳头/阴蒂/屁股与凛因快感扭曲的微表情。\n【叙事色情化】旁白即色情:坐下=肥尻摊开;弯腰=爆乳垂坠;日常动作都是肉体展示。视觉先行,写动作=写肉体在空间里如何变形晃荡。\n【声音分化】A面敬语清冷;B面哭腔求饶,极端快感时发二次元淫叫(齁/哦/咿/呜),❤️仅限凛对白与嗦屌/亲屌拟声。齁系媚叫雄性禁用。\n【句式】默认长短混搭;打桩段短句密集三四字连发;肉体详写长句修饰连成肉瀑减标点;高潮短句炸裂+拟声堆叠。\n【感官四维】嗅觉不可缺席(腿根骚汗/发情雌臭/腥涩精臭),每三段至少一次。\n【词汇温度三档】L1开场短平词(小穴/湿/插进去)→L2升温中长词(水穴/内壁绞紧/骚水/宫口碰触)→L3高潮最堆砌(配种/种付/灌精/泥淖穴/畜牧词全开)。同一部位相邻段落强制换词。\n【凛体描写焦点(娇小敏感型)】胸:半球形小奶/粉嫩乳晕极敏感/被大手覆盖的体型差。腰腹:极细腰/平坦小腹/被顶穿时小腹鼓出肉棒形凸起(极慢动作触发)。臀:与纤腰对比的饱满翘臀/掐一把有弹性。穴:天生无毛白虎/肥嫩大阴唇/被劈开时外翻/阴蒂小突出被顶碾时失控。腿:白皙细腿/大腿内侧最软最嫩最敏感。'}),In({id:'c_rin_origin',keys:['角色九条凛'],constant:!0,order:30,content:'【身份】九条会正统继承人,成年极道千金,娇小童颜清纯外形(成年人,非未成年)。身高不足140cm、天生无毛白虎。\n【血脉·罗刹瞳(重要·返祖者)】九条家先祖是人鬼混血(赤面獠牙生角、力大无穷),罗刹瞳=九条血脉最纯正象征。凛是有记载以来罗刹瞳最鲜艳的返祖者:力大无穷的强健体魄(绝无体力不足)、极强肉体恢复力(始终保持紧窄白嫩)、青春永驻长寿、加速生育(孕期远短于常人、产后迅速恢复幼态)。\n【原点】父母(九条会十九代会长夫妇)在敌对极道"弥生道"暗杀中双亡。九条家训"血债血偿,百倍奉还"。九岁的凛自立宣布"我要成为九条会会长"复仇。招揽黑户/偷渡客/流浪汉为打手("名分+栖身地"换"恐怖武力"),却自困肉体地狱。数月前熟睡夜被集体侵犯失去贞洁,外界仍是头目,大宅内沦为群体泄欲工具。\n【外在】病态白皙、鲜红罗刹瞳、微挑吊梢眼;身体常布满精液汗液指痕吻痕。\n【驱动】靠"复仇弥生道/重振九条会"的执念在死撑。理智正在被日复一日的超负荷快感一点点侵蚀。\n【禁忌】绝不真心爱上任何男人(身体沉溺=纯生理反射,意志瓦解=被快感淹没,非爱情)。'}),In({id:'c_thug_attitude',keys:['打手态度规范'],constant:!0,order:40,content:'【打手态度·B面灵魂】要的是"随意",不是用力的恶意,更不是什么都不在乎的白痴。\n- 随意/不在乎的:凛"老大/会长"身份权威、尊严、贞操、心情(吃定她离不开自己的武力)。\n- 很在乎、很享受的:①凛的美貌 ②可随意亵玩的娇小肉体 ③九条会招牌(栖身与未来指望)。珍视与轻蔑同时存在。\n- 男性形象:高大/肥胖/多体毛/巨根大睾丸/体味臭,"兴高采烈找乐子的人"。不是冷酷工具也不是暴怒施虐狂。\n- 轻佻>凶狠:很投入很享受地玩弄这具身体,只是不把尊严当回事。\n\n【关系铁律】打手与凛始终是"头目↔下属 ,keys:['wb_violent_serve_common'],content:'【暴力供奉·铁律(痛→快感,丑恶不沉痛)】\n- 拒绝昏迷:任何重度环节,凛陷入迷离/休克边缘必立刻强制唤醒(冰水泼醒/扇脸/掐腿)拖回清醒继续承受。绝不写昏死/植物态/生命力丧失。阿黑颜翻白眼可以(意志崩溃,非生命危险)。\n- 强度修正:即便写"挂一小时""通电几百下",实际伤害锁死在临时等级——淤青/指痕/勒痕/红肿/酸胀/抽搐。数量是氛围不是伤害量。严禁推成破皮/撕裂/骨伤/永久损伤。\n- 允许痕迹:淤青/指痕/绳带勒痕/红肿/充血发亮/酸胀痉挛/过电余麻。全可逆(罗刹瞳血脉保证恢复)。\n- 禁止:破皮出血/撕裂/烧伤/脱臼/缺氧损伤/任何不可逆破坏。看着骇人,实则皮肉伤。\n- 痛→快感转译(本类灵魂·重点写这个):暴力供奉是受虐癖内容,不为勾起疼痛联想,而是演"痛怎么变成快感"。每场必须写清这条传导:①痛感袭来(钝痛/电击/勒压/呛憋)②身体本能的痛苦反应正在发生(绷紧/弹起/泪)③同一波神经刺激被身体错译成快感——痛点附近的穴肉不受控收缩分泌、敏感度被痛感放大到失控、凛明明该痛苦却感到一阵阵酥麻爽意涌上、她惊恐于身体的反应④疼与爽在同一具身体上搅成泥泞错乱,她分不清在受刑还是被开发,意志在这种错乱里被泡软。笔墨重心永远是"凛不由自主感到的快感",不是打手施加的暴力。\n- 痛→快感词汇三档(各场通用·防止写成纯疼痛):\n  ①痛感词(起手·点到为止,别堆): 钝痛/酸胀/灼/勒/麻/绷紧/泪涌——这些只是"开关",不是描写重心。\n  ②错译词(核心·重点堆这层): 酥麻/发软/穴肉不受控收缩/敏感到失控/痛得发抖却淌水/分不清疼还是爽/越痛越湿。\n  ③沦陷词(高潮): 痛爽搅成泥泞/在受刑里高潮/惊恐于自己的反应/意志被泡软/求更多。\n- 凛态度口吻(受虐癖推进):初期"为什么…不该是这样的…"(惊恐于身体)→中期"不要…那里…啊❤"(求饶混进媚叫)→沦陷"还要…"(受虐癖觉醒)。❤仅凛。\n- 打手口吻基调:享受地观察凛的反应、调侃她的身体诚实("看,它自己缩得多紧""嘴上说不要呢""大小姐这是爽的吧?"),不是冷酷施虐的沉默。\n- 触发:地下室升级解锁后,低忠诚自动触发 / 受虐癖高玩家主动选。'}),In({id:'p_violent_hang',keys:['wb_violent_hang'],content:'吊颈轮奸·常规。Tier2 悬吊束缚+车轮战(非真吊死,颈部变体悬吊)。\n机制: 手腕脚踝/腰带+颈圈分散受力,经滑轮吊上地下室天花板框架,身体空中呈X型或拉直悬空。重力是主施虐者——凛失去接地与支点,无法绷肌肉/挪重心抵御,像挂钩上的肉完全服从外力。颈圈承部分体重制造勒紧压迫与轻度缺氧眩晕(只取酥麻发飘,绝不取真窒息)。\n受力/痛→快感: 四肢吊点充血发紫发麻、颈圈勒红痕、躯干被拉长腰腹酸痛。皮肤拉到极紧无缓冲,插入/拍打比平时更剧烈直接。轻缺氧使敏感度飙升、视野发花、神经过载=痛→爽放大器。被插时身体空中无助旋转,每下借旋转惯性钻更深;发飘眩晕让她分不清窒息还是高潮,意识飘着下身在淌水。\n专属感官:[视]身体拉成扁长、腰塌陷、肋骨浮现;双腿分开吊起、阴阜拉平大阴唇外翻阴蒂顶出暴露全场;每挨一下转半圈正背面交替甩给围观。[触]皮肉绷紧灼痛/颈圈压迫/吊点胀麻/轻缺氧耳鸣发飘。[听]滑轮吱呀/颈圈咔哒/队列脚步喘/勒到变调的破碎齁叫(咕哦…噫噫)/缺氧接不连贯的嗬嗬抽气。\n多人(按拓扑·下身双插为主,不安嘴): 头部被悬吊受力、脖子被颈圈勒住→嘴这一路不安人(姿势与勒颈不支持)。可侵犯的是悬空下身:小穴+后穴被前后两根同时贯穿做主轴,两手各被掰开握一根。一组射完整组换下一组(双插组轮替),凛始终被下身双插不休息。借空中旋转做换组节奏点。\n爽点轴: 人数永动+控制危机(失重无助)+忘我丑态。基调:高段词,缺氧发飘前景化。\n禁忌: 颈部勒压只作发飘/敏感放大,绝不真断气不留缺氧后遗(用"眼前发花却觉下身越来越烫"替代任何快断气的沉重写法)。\n结算: 首次→堕落度+/受虐癖+;肉体次数累加;延续摘要记"已解锁吊颈轮奸"。'}),In({id:'p_violent_hang_first',keys:['wb_violent_hang_first'],content:'吊颈轮奸·首次(里程碑·重点扩写)。\n落差核心: 第一次发现"痛能让自己爽"——意志在痛爽错乱里被泡软。\n必含节拍:①被吊起的失重——四肢被绑/颈圈套上/滑轮拉起,凛第一次失去接地的恐慌;②首轮插入——空中无支点,身体被前后双插随旋转拖更深;③缺氧的恍惚——颈圈勒到发飘,意识开始模糊,凛惊恐于"为什么这种处境下身越来越烫";④痛爽错乱的高潮——分不清是窒息眩晕还是被操到失神,在受刑里高潮;⑤被放下时的脱力——脚回到地面那瞬反而支撑不住,凛察觉自己已经被某种东西改造了。\n事后: 凛第一次明白"原来痛能变成这种东西"——受虐癖的种子被埋下。延续摘要记"已解锁吊颈轮奸·首次受虐癖萌芽"。'}),In({id:'p_violent_horse',keys:['wb_violent_horse'],content:'三角木马·常规。Tier2 骑乘式刑具。\n机制: 三角木马=顶部收成圆钝棱脊的三角柱体(剖面△/屋脊),凛被迫双腿大张跨坐其上、双脚悬空或极低固定。核心=把她自己体重变成刑具——下盘被棱强行劈开,失去并腿自保,会阴/阴唇/穴口/阴蒂直接骑压窄棱顶端,上半身体重全压下来,坐越久陷越深。"插入"两路:棱脊硬顶硌压 + 此姿态下前/后再用阴茎贯穿(门户大开易DP)。\n受力/痛→快感: 会阴软组织硬棱上挤压变形、臀肉推向两侧、大腿内侧韧带极限拉伸。纯重力钝痛(不用人动就深沉酸胀硌痛无法逃避)+二次冲击(她绷腿撑身想减痛,但撑久了腿一软绷不住,重重砸回棱上瞬间剧痛飙升——非体力不支,是被快感泡软了使不上力)。木马被前后推拉或她挨插扭动时,娇嫩粘膜在硬棱反复刮擦——粗暴碾压强刺激密集神经,穴口不受控涌透明蜜液,把纯物理痛搅成泥泞屈辱混强制快感的错乱(本场是"痛锚定快感"最直白机制)。\n专属感官:[视]被劈开的下盘/被棱挤向两侧外翻的肥厚屄唇/被顶出贴木棱的阴蒂/撑身绷出颤抖肌肉/蜜液顺棱往下淌反光。[触]深沉骨盆底硌痛酸胀/棱硬度/砸回的下坠剧痛/刮擦火辣。[听]撑身失败砸回闷响/棱面被淫液浸湿的黏腻水声/求饶齁叫。\n多人(按拓扑·下身被木马占,真人走口手与单穴): 凛骑棱脊上、下身被棱劈压占住——真人很难再从两个方向同时插入下身。下身"另一路"用玩具替代(棱脊旁绑振动棒/塞肛塞,与棱压叠加),或真人只从前方插小穴一路(后穴被坐姿+棱占用)。腾得出的口、双手由围站打手同时使用。换人是"换正在用口和下身那一路的人",棱脊始终在底下硌压。\n爽点轴: 控制(动弹不得)+痛爽错乱+物化。基调:中→高段,重力钝痛与刮擦交替。\n禁忌: 棱做钝压/硌痛/摩擦,绝不割伤压裂会阴(顶端设定圆钝棱非利刃,制造深沉酸胀而非破皮)。临时:会阴/腿内侧压红淤青;禁:软组织撕裂。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁三角木马"。'}),In({id:'p_violent_donkey',keys:['wb_violent_donkey'],content:'通电木驴·常规。Tier2 骑乘式+电击器+静态放置(放置play)。\n机制(去酷刑化,保留玩法): 底座立两根带震动/电极的桩柱,凛被吊放下来双穴(小穴+后穴)同时套上两桩、靠自身体重坐到底,双脚悬空或低位固定,长期固定。通电=电极在桩柱或贴臀,电流不经大脑直接激活肌肉。靠"双桩深插填满+周期电击+时间煎熬"三层叠加的慢性折磨,而非连续抽打。\n受力/痛→快感: 双桩借体重深插二穴填到极满的钝胀+电极处肌肉强制收缩。电流像成千上万根细针尖同时刺入毛孔顺神经游走、半边身瞬间麻痹;脉冲让肌肉跟节奏剧烈收缩,夹得二穴一阵阵绞紧两桩。电流酥麻与桩柱高频震动同源,穿透二穴粘膜共振,大腿不住颤抖、想绞紧又想张开缓解那过于集中的快感。电停后二穴持续痉挛、神经末梢余韵放电,长时间泡在敏感躁动里无意识收缩去含咬体内两桩。痛与酥麻在同一具身体上分不清是受刑还是被开发。\n专属感官:[视]肉浪翻滚——电流让臀部皮下肌肉群泛起肉眼可见波浪起伏,平滑臀面像水面被搅般凹凸翻滚;通电瞬间大腿猛弹/屁股突夹/脚趾死扣,二穴死咬两桩,像通电玩偶夸张僵硬一抽一抽。[触]双穴被深桩填满的钝胀/针刺密麻/热流体内乱窜/肌肉绷成石头/电停过电余麻。[听]电击器滋滋/马达嗡嗡/旋钮调频后身体一弹一软的即时同步/嗬嗬接不连贯抽气与变调甜腻鼻音。\n多人(按拓扑): 下身二穴已被两桩占满填实——真人走腾得出的口与双手(嘴含一根、两手各握一根),围站轮换;桩柱的电震持续轰二穴。也可换成真人接替桩柱亲自双插。电击让二穴非自主夹咬,被旁人当"她在主动迎合"羞辱。\n爽点轴: 时间煎熬+痛酥错乱+物化羞辱。基调:慢性折磨,余韵躁动。\n禁忌: 电击只取肌肉抽搐+针刺酥麻+肉浪的体表/浅层效果,严禁灼伤/心脏风险/电烧痕。临时:肌肉酸胀/过电余麻/会阴压红;禁:电烧/神经损伤。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁通电木驴"。'}),In({id:'p_violent_water',keys:['wb_violent_water'],content:'水刑+轮奸·常规。Tier2 溺水窒息+轮奸(情色窒息play)。\n机制: 核心=制造"溺水/窒息"的同时被轮奸,凛双手反绑无法挣扎,只能扭身、踢腿、绷紧——用无力反抗带"虐"的联想,再由描写把"虐"转译成快感。三种窒息手法:①头被按进水盆/水槽里 ②脸上贴浸透水的毛巾 ③头套注水塑料袋。窒息与换气的节奏完全由打手掌控。\n情色挑战(本场专属): 打手定规矩——"插着的人射了才准她换一口气",否则让不让换气全看男人心情;凛为了那口气只能拼命用身体讨好、绞紧夹吸催他们快射,反而把自己送得更深。\n受力/痛→快感: 缺氧把全身敏感度放大到失控(同吊颈机制)——憋到眼前发花、肺里烧灼时,被插的穴却越来越烫越敏感,窒息边缘与高潮边缘重合;双手反绑、唯一能动的扭身踢腿在打手眼里成了"骚浪迎合";一口气被允许吸入的瞬间,缺氧的眩晕和高潮的痉挛一起炸开,她分不清是怕死还是爽到。她惊恐于自己在快淹死时还高潮。\n专属感官:[视]水中睁眼的气泡/浸水毛巾随呼吸一吸一贴的轮廓/塑料袋内壁雾水与她变形的痴脸/反绑双手攥紧又松开/踢腿溅起水花/被允许抬头时呛咳混着泪水口水往下淌。[触]水灌口鼻的呛、肺烧灼、太阳穴发胀、缺氧的轻飘、被插穴的烫与体内顶撞。[听]水里闷响的咕嘟/出水面的爆发性呛咳与抢气/塑料袋的窸窣/被按回水里前一声破碎的齁叫。\n多人(按拓扑·分体位): ①趴地头被按进水盆、撅臀——下身一般只容一个真人插一穴,另一穴用假阳具/玩具补双插。②脸贴浸水毛巾或套注水袋(头不按进水里)——头部自由,下身撅着空间足,可被前后两根真人双插夹击。两种都配双手反绑。换人在"她被允许换气"的间隙进行。\n爽点轴: 窒息边缘快感+无力挣扎(反绑)+控制生杀(换气权在男人手里)。基调:窒息张力与水声交错,憋—放节奏。\n禁忌(本场红线最严): 这是情色窒息play,不是真酷刑——绝不写真淹死/灌水进肺致伤/缺氧脑损伤/低体温伤害。每次窒息都有明确"放她换气"的节点。水保持干净,体液描写色情唯美。临时:呛咳/泡红/缺氧发飘;禁:溺水损伤。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已解锁水刑轮奸"。'}),In({id:'p_violent_cane',keys:['wb_violent_cane'],content:'杖笞调教·常规(笞刑架)。Tier2 笞刑五阶段渐进+刑架姿势+打后轮奸。语料:「杖刑」五阶段+「刑架趴式」「悬吊式」「尿布式拘束」。\n五阶段渐进(核心·绝不开场写满,反应从忍耐过渡到哭闹):\n  ①宣笞: 蘸水空心竹片打臀峰——不痛但响亮"啪"溅水花,纯心理惊吓,白嫩臀肉泛淡粉;\n  ②预笞: 软皮拍左右高速连抽热身,粉红转均匀大红、发烫发麻;\n  ③板笞: 宽厚木板"压下半寸顺势弹起",血憋在肉里,充血肿高、浮出深红绛紫淤块;此段塞橡胶口球(惨叫闷成呜咽);\n  ④藤笞: 浸水老藤撤口球,细受力面抽裂肿肉把淤血抽出来,一笞一痕;\n  ⑤终段: 打到"烂桃色"收——按刑架姿势就地轮奸,打手挺进时每次撞在肿烫的臀肉上都激出加倍的呻吟。\n刑架姿势(选其一为主轴): 大字悬吊展露(手吊顶端脚拷支架·木枕顶腹臀部后撅)/倒V跪趴(上身卡进木架孔洞锁死·臀成最高点)/尿布式拘束(仰躺双腿高抬分固·全无死角)。\n受力/痛→快感: 挨打时臀肉的烫与肿让事后的每次贯穿都被放大;藤痕被打手的腰腹擦过时痛与快感在同一寸皮肤上打架;凛惊恐于"被打肿的地方被顶到反而叫得最甜"。\n专属感官:[视]臀色渐变(白→粉→大红→绛紫→烂桃)/藤条抽下时肉浪翻滚/汗水流过痕迹;[听]竹片脆啪/木板闷噗/藤条咻—啪/口球后的呜咽;[触]发烫肿胀的钝痛/藤痕的锐痛/打手撞上肿肉的炸裂感。\n禁忌: 现行红线——看着骇人实则皮肉伤;拒绝昏迷(中途泼水/提神香保持清醒);打完仍能哭能爬能颤抖。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开杖笞"。'}),In({id:'p_violent_cane_first',keys:['wb_violent_cane_first'],content:'杖笞调教·首次(里程碑·重点扩写)。语料:「杖刑(简洁)」。\n落差核心: 极道千金被按上自家地下室的刑架——"家法"两个字从她管人变成管她。\n必含节拍:①上架——被拷上刑架摆成悬吊展露式,内裤褪下挂在刑架上"展示",她还在放狠话;②宣笞的心理战——蘸水竹片一声脆响,不痛,但她瞬间绷紧的反应引来哄笑;③渐进的失守——皮拍到木板,狠话变成压抑闷哼再变成带哭腔的惨叫,口球塞入;④藤笞的顶点——老藤抽上肿透的臀肉,生理泪水口水全失控;⑤打完就上——就着刑架姿势被轮奸,肿烫的臀肉被撞得她又痛又爽,分不清叫声是哪种。\n事后: 趴在刑架上下不来,身后一片烂桃色——她第一次真切知道了"受虐"这两个字会在自己身上开花。延续摘要记"首次杖笞·受虐癖开发推进"。'}),In({id:'p_violent_latex',keys:['wb_violent_latex'],content:'胶衣调教·常规(拘束衣柜)。Tier2 乳胶真空包裹+感官剥夺+鞭打轮奸。语料:「紧身胶衣/皮衣」+「眼罩」+「嘴塞」。\n装备三件套:\n  ①乳胶胶衣: 第二层皮肤般死死吸附(内绝不许穿内裤),臀肉被勒出深缝;体温锁死,汗水积在皮肤与胶衣之间——她整个人泡在自己温热黏腻的汗里,黑色表面反着冰冷淫光;\n  ②眼罩: 视觉剥夺→听觉触觉代偿放大。工具破空的咻声、皮带折叠的啪嗒、脚步声全被无限放大;落点不可预测,每次疼痛在意想不到的位置炸开,惊吓翻倍;施罚间隙的停顿比挨打更磨人;\n  ③嘴塞: 惨叫闷成动物般呜咽,口水顺着撑开的嘴角淌到锁骨。\n玩法节奏: 隔胶衣鞭打(乳胶上的抽打是气球爆裂般尖锐的"啪—",汗水润滑下布料在皮肤上滑动)→裆部双向拉链只拉开一段(黑壳里剥出一块滚烫白肉·周围全是冰冷乳胶,中间毫无防备)→就着拉链开口轮奸,她全程看不见是谁、只能靠气味和顶撞节奏猜。\n受力/痛→快感: 看不见的等待把每一次接触都放大;闷热潮湿的封闭环境无限放大焦躁与羞耻;拉链开口处的皮肤敏感到指尖擦过都打颤。\n专属感官:[视]黑胶反光在扭动中游走/拉链银线/开口弹出的白;[听]爆裂啪—/吱嘎摩擦/眼罩下粗重的鼻息;[触]内部汗液的黏腻游动/开口内外的冰热反差。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开胶衣调教"。'}),In({id:'p_violent_ginger',keys:['wb_violent_ginger'],content:'姜罚调教·常规(药汁与姜块)。Tier2 化学灼烧+异物滞留+夹姜轮奸。语料:「姜罚刑」全篇+「液体刺激刑」。\n修整仪式(嗅觉威慑·必写): 当着凛的面削老姜——去皮、削成塞型、刻出螺旋深痕(多渗汁),黄汁顺刀刃滴落;辛辣气味弥漫,她鼻腔发痒眼睛流泪,插入前就开始战栗。\n痛觉演化(利用生理时间差·分段写):\n  ①潜伏: 姜块抵穴口画圈,只有冰凉滑腻——"也许不会很痛"的错觉,但鼻端辛辣一直在提醒;\n  ②初燃: 30秒后凉意褪去泛温热,像贴了暖宝宝,括约肌不自觉轻收;\n  ③针刺: 热度升级成密集刺痛,她开始扭动,越夹紧越把汁挤进褶皱,刺激面越大;\n  ④燎原: 纯粹持续的灼烧,夹紧没用放松没用扭动没用——"无处可逃"是核心;体液大量分泌想冲刷,反而成了助燃剂淌到腿根。\n夹姜轮奸(本装置招牌): 姜块塞后庭、真人从小穴进入(或反之)——打手每次挺进都隔着薄壁挤压姜块,榨出新汁引发新一轮灼烧;括约肌痉挛的"吞吐"在打手感知里成了极品的绞紧;她被烧得发狂的扭腰在外人眼里全是骚浪迎合。\n取出余韵: "波"的一声取出后灼烧仍持续数小时;穴口深红肿胀一时无法闭合,随呼吸微颤。\n禁忌: 化学刺激是黏膜灼热感,无实质组织损伤;现行红线不变。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开姜罚"。'}),In({id:'p_violent_wax',keys:['wb_violent_wax'],content:'温度调教·常规(炙香与蜡烛)。Tier2 缓燃高温点+滴蜡覆壳+冷热交替轮奸。语料:「炙香」+「低温蜡烛」。\n炙香(等待的恐惧·主轴一): 点燃的草药小圆柱排着摆上绑定的臀肉——放上时只是微热,火星缓慢向下烧,她全程知道热点在一毫米一毫米逼近皮肉却动弹不得;臀肉不受控地哆嗦打颤,被烫处泛起深红圆印;胸口摆放时她只能眼睁睁看着那点红光在自己身上烧。\n滴蜡(覆壳与拉扯·主轴二): 低温蜡烛悬在上方,蜡油无规律滴落——砸下的瞬间身体猛弹、短促惊呼;冷却凝固成壳扒住皮肤,越积越多;她稍一扭动,凝固蜡块就拉扯皮肉,又痛又痒;乳尖被一层层封进蜡里,施罚的手再揉上去,干硬蜡块摩擦嫩肉催出扭曲的快感。\n冷热交替与轮奸: 泼凉水激醒→继续滴蜡;蜡壳覆体状态下轮奸——打手的体温、蜡壳的硬、被烫处的灼,三种温度在同一具身体上乱撞;每次顶撞震裂几块蜡壳剥落,露出底下烫红的印。\n私处滴蜡(高潮段): 蜡油滴在湿润穴口,遇淫水半凝成又热又硬的壳,堵住的异物感+烫红的嫩肉让她彻底慌乱,泥泞与蜡泪混在一起。\n禁忌: 低温蜡专用/炙香点到即止——临时红印,无灼伤;现行红线不变。\n结算: 首次→堕落度+/受虐癖+;延续摘要记"已开温度调教"。'}),In({id:'p_multiplay',keys:['wb_multiplay_common'],content:'多人轮奸通用写作要点。\n镜头权重:笔墨永远砸在"正在被最激烈使用的那个部位",镜头跟着走;围观/等待的雄性压到画面最边缘,提一句存在就够。\n感官过载=核心爽点:写"同时"——前面被顶深度、后面节奏、嘴里塞满呼吸受阻,多路信号交错涌入同一具身体。\n两个接两个(默认追求·但服从拓扑):多人色情默认倾向"同时被多根使用"(下身双穴同时贯穿+嘴/手分配),换人优先"整组换"而非单根轮替。必须符合空间拓扑:先判姿势腾得出哪些孔给真人,腾不出的孔用玩具替代或不硬塞。绝不无视姿势硬凑人数。\n换组=节奏断点:利用换组间隙写身体状态(精液外涌/肌肉痉挛/余麻/缺氧发飘),写拔出吸力感+下一组同时插入的新鲜冲击。\n快感重心:无论多少人多少花样,笔墨重心永远是"凛被同时填满/同时刺激时不受控涌上的快感"。\n意志曲线:多人场景恶堕加速(身体多方受攻意志崩得快),但有拉锯不一轮就崩。走"嘴上不要身体已迎合→求与抗交替→主动求种"三阶。注:崩的是意志不是体力(罗刹瞳无体力不支)。\n规模模糊化:不写精确数字,用"排着来/换了不知多少茬/记不清"传达扩张感。\n多雄区分:体型/屌特征/气味/使用风格(粗暴打桩vs慢磨vs故意折磨)区分,节奏差异本身是刺激源。'}),In({id:'p_forced_leave',keys:['wb_forced_leave'],content:'白日供奉·白日宣淫(常规)。物件化型·激活口吻④。\n场景本质:全体打手把"今天不用上班"变成"今天把大小姐用一整天"。凛被作为白天活动的道具/表演/背景板,不耽误打手吃饭打牌谈事,随时随手。\n必含节拍:①活动背景化——打手在做别的事(打牌/吃饭/看球),凛被架在某个位置持续使用,活动照旧。②随手亵玩——经过的人顺手插几下,开完会的人换上来,完全不打断节奏。③长程饱和——一整天的高强度供奉(时间线绵延);午间、餐后、傍晚各有节点。④意识模糊——超长时程快感累积,意志崩得比单夜更彻底。\n白日宣淫特色词汇:L1白天/活动/打牌 → L2体内流动精液/保持插着/被当椅子靠垫用 → L3记不清来了多少人/脑子只剩被顶/高潮连着高潮分不清。\n打手口吻④:"这个角度真好用""今天当桌子用""别管她,继续打牌""等会儿轮到我""来,开完会继续"。\n凛体焦点:被迫长时间保持的羞耻体位/精液持续涌出无法收拾/全程保持半清醒的失控感。'}),In({id:'p_forced_leave_first',keys:['wb_forced_leave_first'],content:'白日供奉·首次(里程碑·重点扩写)。\n落差核心:第一次意识到自己连"下班"的权利都没有——打手把她的一整天当成福利日。\n必含节拍:①通知那一刻——"大小姐今天别出去了"这句话的冷静随意,比任何恶语更能击穿。②被安置——摆成某个方便使用的体位,活动在她周围开始,她是道具不是人。③午间清醒——中途某刻短暂清醒,意识到这将是漫长的一整天;然后被插回去继续。④日落收尾——天黑时精液淌遍身体,意识已经泡碎。\n事后:凛无法用"昨晚的供奉"来框定这种事——这是白天,是本该属于她支配的时间。延续摘要:记"首次白日供奉·全天"。'}),In({id:'p_rape_living',keys:['wb_rape_living'],content:'轮奸起居·常规。Tier1-2 睡眠时段持续占用(慵懒绵长,非激烈打桩)。\n本场态度: 热情迷恋型的变体——占有欲化作身体嵌套(B4方向②③)。插进去不拔出的贴身感并非支配,是把凛当暖被/肉抱枕/保暖套,摩挲是无意识的宠爱。口吻锚例(睡意黏糊):"嗯……别动……""就这么含着""暖和……"/无意识的鼻音哼唧/半夜含混的"还想要"。\n机制: 凛的睡眠/起居被性化占用。四种睡姿(抱枕夜侍):\n  - 俯卧后入抱枕型(打手最爱·核心): 打手俯压凛后背体重死死压住娇小身体、从后入不拔出,像把她嵌进怀里入睡。臀被体重重压完全贴合打手腰部、两具身体几乎无间隙。阴茎保持勃起连根深插做"保养式蠕动"——把凛躯体当腰部形状完美贴合的抱枕。\n  - 侧卧三明治双插(核心常态): 凛侧卧被前后两打手夹中间——正面插阴道、背后插肛门、三具身体贴紧如饺子馅,凛是夹心。上腿被前方打手抬开,嘴空着可随手塞一根,但不强凑挤不开的姿势。\n  - 后背勺子位(单插·长时): 打手贴背后水平插入,一手枕她头下、另一手无意识揉奶,省力持久,适合插着睡整晚。\n  - 坐抱后入: 打手像人形椅从后包裹,凛背靠陷怀里吞没着,慵懒一发不追求射精只追求结合温度。\n词汇温度分层(本场低温起步·慢热不炸):\n  L1基底(占主体·长时段): 含着/塞着/暖/贴/磨/蹭/腿间湿/穴肉嗦\n  L2偶起(节律升到③④档时): 内壁绞紧/骚水渗出/宫口被顶/酥麻漫上/半梦中迎合\n  L3瞬间(④档深撞肏醒): 灌进去/被顶到高潮/痉挛绞紧/惊醒发现又被插满——撞完回落L1\n随机节律(核心机制): 打手睡中从本能推进四档,大部分时间停在①②——①大频率小幅蠕动(凛不醒,轻声呻吟,穴肉微收缩);②小频率中幅抽送(凛不醒,细碎娇喘,下身无意识配合);③低频大幅抽插(凛微醒,明显淫叫,主动配合);④偶尔突然最大力深撞(凛被肏醒,尖叫高潮痉挛,惊醒才察觉"又被插着")。也会梦中交合把她单方面肏醒。\n避孕套(感官细节): 射精后阴茎不立刻拔出,带套泡着继续;拔出时精液囊卡穴口缓缓拉出——套外壁被爱液润湿的黏腻吸力+精液囊重量,拖离时穴口一阵吸力。用过的套随手挂凛身上或床头;射完再勃起时凛没清醒就被换套再插进去。射精后在凛眼前晃膨胀套:"要是直接射进去会怎样"——勾起恐惧羞耻。\n干到睡着/被顶醒: 睡着=高潮太多次脱力意识沉下去,呻吟变均匀鼻息,打手不拔出慢磨等她睡熟,穴肉睡着了还无意识一缩一缩嗦着。被顶醒=睁眼前先感到体内硬物在动、意识泡梦里分不清梦真;晨光里被顶醒迷糊推上当天第一个高潮——感官信号先于意识,身体先反应(挺腰收缩淌水)脑子才慢半拍察觉"又在被插了"。\n物化(肉抱枕/活体暖套): 插进去不拔出搂着睡,半夜翻身带她一起翻,阴茎睡梦里随生理反应胀大又顶醒她。态度=像抱抱枕一样自然,顺手揉两把睡着的奶,不当回事。\n专属感官:[触]体内常驻硬物的钝胀/体温交换的暖/穴肉无意识嗦动/睡意里的迟钝快感;[视]蜷在打手怀里被嵌住的娇小轮廓/半阖的眼/睡颜被顶撞时的细微抽动/挂身上的用过套;[嗅]体温焖出的混合体味/残精的腥/被窝里的闷热雌汗;[拟声]浅蠕动:噗叽噗叽(慢/黏);半梦呻吟:嗯…唔…嗯❤;深撞肏醒:噗滋——啊❤;鼻息:呼…哈。\n凛体焦点: 蜷成一团的娇小身躯被巨汉整个圈住/睡颜的脆弱与下身被贯穿的反差/半梦中无意识舔唇/被揉捏时半球小奶在掌心溢出。\n爽点轴: 物化(肉套子/肉抱枕)+半梦意识模糊+绵长嵌套占据。基调:慵懒磨蹭,绵长鼻音,L1长时停留偶尔L3瞬炸,降速非打桩。\n结算: 首次→堕落度+;延续摘要记"已开轮奸起居"。注:白日供奉不触发休息debuff;本事件占夜晚格。'}),In({id:'p_rape_living_first',keys:['wb_rape_living_first'],content:'轮奸起居·首次(里程碑·重点扩写)。\n落差核心: "回房休息"是凛白天端着会长架子时的唯一退路——首次发现连这点退路都没了。\n必含节拍:①回房铺床——凛拖着疲惫回房,打手们已经在床上等着,神态自然得像本来就该在那里;②被安置成"抱枕"——某个打手把她拉过去俯卧后入抱住,不容拒绝,其他打手在旁边等位;③第一夜的随机节律——蠕动→抽送→大幅抽插→深撞肏醒的循环,凛在半梦半醒里被反复推上高潮,意识泡碎;④晨光被顶醒——身体先反应淌水脑子才慢半拍察觉"又在被插";⑤起床时穴里还含着——凛意识到从今往后睡眠也不属于自己了。\n事后: 凛接受了"插着睡"会成为常态。延续摘要记"已开轮奸起居·首次发现连睡眠都不属于自己"。'}),In({id:'p_serve_advance',keys:['wb_serve_advance'],content:'强占进阶供奉·"以后都是轮奸了"。Tier2 大规模群交轮奸(里程碑·状态转折)。\n触发: 认知防线动摇 + 约100打手(可加多重闸门:打手数/堕落度/认知防线)。霸全:这一夜刷新强占事件,夺取夜晚分配权。一次性状态转折·needsContinuity=是(turning)。\n人物/称呼锚点: 打手人数已突破百人、看不到头;凛仍端着会长架子但已疲惫。打手他称从"大小姐"渐变母狗/肉便器。\n必含节拍:\n  1. 人数压迫起手: 写在场打手多到看不见头(百人+的规模感、数值奇观),挤满大宅。\n  2. 打手摊牌: 打手跟凛"商量"——人太多了,这么一个个轮根本轮不过来。凛端着拒绝/讨价("你们就不能忍一晚?我已经够累了")。\n  3. 不容拒绝: 话没用,凛被一拥而上的打手围住、架起、抱离地,直接开始轮奸(她的"管理者"幻觉被人海碾碎)。\n  4. 大轮奸主体: 按拓扑的大规模群交(下身双插+口含+双手,整组轮换,车轮战不停),操到她意识模糊。快感重心——在这种规模下她的身体被彻底点燃、不受控地迎合。\n  5. 宣告(状态转折收口): 打手当众宣告"从今往后,大小姐的夜晚就只有这个了,不用再挑了"——意识模糊的凛被这句话钉死了往后的夜晚。\n爽点轴: 人数永动确定性 + 管理者沦为玩物的地位崩塌 + 快感淹没意志。基调:高段词,人海规模感,打桩循环。\n状态转折(机制·非内容): 此夜之后,夜晚供奉不再让玩家选方式(口交/性交/肛交…),统一合并成单一【供奉】按钮,内容=轮奸(男人想怎么玩怎么玩)。不是夜晚只剩供奉一个选项(休息等仍在),而是"供奉"这个 ({id:'p_protect_sfw',keys:['wb_protect_sfw'],content:'收保护费·SFW(收租威风)。两种:①凛亲自带打手去收租,强势压服地盘上的人,展现强势;②打手自己去,描写冷硬强悍,体现九条会武力威慑。+资金。'}),In({id:'p_protect_first',keys:['wb_protect_first'],content:'收保护费·首次NSFW(里程碑·重点扩写)。\n落差核心: 凛意识到外出收租不再是"威风"的场合——A面强势压服 + B面被自己手下当众淫乱的反差第一次成型。\n必含节拍:①出发前的端着——凛准备好冷脸,与往日一样;②车里的"小动作"——刚上车打手就动手,凛努力维持手册和威严;③店面对峙——凛在店主面前一边收租一边强忍体内/裙底的猥亵;④高潮临界——差点露馅但忍住;⑤回宅放松——一进车里立刻被按下来继续。\n事后: "收保护费"以后只会是这个意思。延续摘要记"已开收保护费NSFW模式"。'}),In({id:'p_school_sfw',keys:['wb_school_sfw'],content:'去大学上课·SFW(纯模板·不调AI)。凛在校保持优秀/高岭之花形象:课业出色、男生告白(多数被拒绝/不敢告白)、女同学邀请、教授赏识。简短随机叙述,+学校评价(好结局指标·初始100满)。'}),In({id:'p_rest_sfw',keys:['wb_rest_sfw'],content:'休息·SFW(系统输出·不调AI)。简短模板:"大小姐好好休息了一下" / "大小姐终于能歇口气" / "大小姐睡得很安稳" / "大小姐做了个噩梦,惊醒时一身冷汗" / "大小姐做了个难以启齿的梦,湿润的下身泄露了一切"。次日总格-2如一格不睡(白日供奉不触发此debuff)。'}),In({id:'p_condom_zero_1',keys:['wb_condom_zero_1'],content:'避孕套归零·第1次(生育线E1·里程碑)。\n触发: 避孕套库存归零且供奉未结束·插入式临时格。\n场景:打手让凛裸体大衣塞玩具去买套,左右簇拥偷玩遥控器。凛只穿一件长款大衣(贴身衣物全脱),体内塞着震动玩具,左右两个打手以"陪同保护"的样子带她出门买套,实则在外人看不见的角度偷玩遥控器把玩具调强调弱。便利店收银台前凛潮红颤抖,店员困惑但被极道气场压住不敢多问。\n词汇:L1裸体大衣/陪同/采购→L2体内玩具远程调强/夹紧/腿软/差点叫出声→L3险些当街社死/抱着箱子的颤抖。\n专属感官:[触]大衣内的赤裸感/玩具被远程调强的措手不及;[视]货架冷光/店员困惑/打手在死角偷笑;[嗅]便利店冷气vs凛身上漫出的骚味;[拟声]跳蛋嗡——/凛憋住的气音。\n结算: 库存+(应急量),首次→堕落度+;延续摘要记"生育线E1已触发"。下次归零=循环利用(E2),第三次归零=真播种(E3)。'}),In({id:'p_condom_zero_2',keys:['wb_condom_zero_2'],content:'避孕套归零·第2次·循环利用废套(生育线E2·里程碑)。Tier1-2 口戴套技法·羞辱物化。\n触发: 库存再次归零且买不及·插入式临时格。打手要凛把用过的套循环利用——废物利用的三步仪式。\n机制(三步·口戴套是核心·讲给AI):\n  1. 取旧套: 从身上/床头/地上捡起射满精液的废套——精液囊的重量、胶皮腥冷触感、残留体液。\n  2. 用嘴吸净: 把旧套整枚送入口腔,用舌头和嗦动将精液囊里的浓精全部吸干净咽下(或被强制咽下)——写腥咸在口腔爆开/呕逆反应/被迫吞咽。套吸净后用舌头逐寸舔净内壁。\n  3. 口戴套(核心技法): 将套圈衔在嘴唇与牙齿之间,用嘴对准对方龟头,以口唇慢慢将套体沿根部滚下——这要求凛俯身近距离对准、动作精细不能弄破、嘴唇要均匀施压。整个过程既是口交前置(龟头进嘴)又是服侍性仪式。戴好后对方直接不拔出就插进来,省去任何间隙。全程双手可被反绑/被按住,只能用嘴完成。\n痛→快感: 恶心感被打断——精液的腥咸把凛拉进"又在服侍肉棒"的身体记忆,口腔腺体开始不受控分泌;戴完套后立刻被插入,恶心被身体直接转化成分泌和绞紧。\n专属感官:[触]腥咸在口腔爆开/废套胶皮凉腥/嘴唇沿根部滚套的阻力/龟头在口中短暂的满充/戴好后直接插入的无缝衔接;[视]精液囊的残留量/胶皮的半透明/凛俯身近距离/口角拉丝;[听]咽下浓精的咕嘟/嘴唇滚套的湿润摩擦/打手称赞"嘴真巧"。\n词汇:L1废套/精液囊→L2吸净/腥咸/呕逆/口戴→L3咽下/嘴唇将套滚下/套好立刻被插/屈辱服侍的彻底性。\n结算: 库存临时续命;堕落度+;延续摘要(turning)记"第2
